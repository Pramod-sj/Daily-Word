name: Run test and Build

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which APK do you want to build?'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read
  pull-requests: write

jobs:
  builds:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          # Removed cache: 'gradle' here to use the explicit cache below

      # --- CACHING SETUP ---

      - name: Restore Android SDK Cache
        id: cache-android-sdk
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android
            ~/.config
          key: v4-${{ runner.os }}-android-sdk

      - name: Setup Android SDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3.2.2

      - name: Save Android SDK Cache
        uses: actions/cache/save@v4
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.android
            ~/.config
          key: v4-${{ runner.os }}-android-sdk

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # --- SECRETS SETUP ---

      - name: Create key.properties files from Secrets
        run: |
          touch key.properties
          echo "GOOGLE_LICENSE_KEY=\"${{ secrets.GOOGLE_LICENSE_KEY }}\"" >> key.properties
          echo "MERCHANT_ID=\"${{ secrets.MERCHANT_ID }}\"" >> key.properties
          echo "GOOGLE_IN_APP_RSA_KEY=\"${{ secrets.GOOGLE_IN_APP_RSA_KEY }}\"" >> key.properties

      - name: Create endpoint.properties files from Secrets
        run: |          
          touch endpoint.properties
          echo "BASE_URL=\"${{ secrets.BASE_URL }}\"" >> endpoint.properties
          echo "API_BASE_URL=\"${{ secrets.API_BASE_URL }}\"" >> endpoint.properties
          echo "WORLD_TIME_BASE_URL=\"${{ secrets.WORLD_TIME_BASE_URL }}\"" >> endpoint.properties
          echo "GET_WORD_OF_THE_DAY=\"${{ secrets.GET_WORD_OF_THE_DAY }}\"" >> endpoint.properties
          echo "GET_WORDS=\"${{ secrets.GET_WORDS }}\"" >> endpoint.properties
          echo "GET_WORDS_PAGING=\"${{ secrets.GET_WORDS_PAGING }}\"" >> endpoint.properties
          echo "GET_RANDOM_WORD=\"${{ secrets.GET_RANDOM_WORD }}\"" >> endpoint.properties
          echo "PRIVACY_POLICY=\"${{ secrets.PRIVACY_POLICY }}\"" >> endpoint.properties
          echo "TERM_AND_CONDITION=\"${{ secrets.TERM_AND_CONDITION }}\"" >> endpoint.properties
          echo "GET_PUBLIC_IP=\"${{ secrets.GET_PUBLIC_IP }}\"" >> endpoint.properties
          echo "GET_IP_DETAILS=\"${{ secrets.GET_IP_DETAILS }}\"" >> endpoint.properties
          echo "HOME_BACKGROUND_URL=\"${{ secrets.HOME_BACKGROUND_URL }}\"" >> endpoint.properties

      - name: Create google-services.json from Secrets
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      # --- BUILD, LINT, AND TEST WITH CACHE OPTIMIZATIONS ---

      - name: Run lint
        env:
          GRADLE_OPTS: >
            -Xmx4g
            -Dkotlin.daemon.jvm.options=-Xmx2g
        run: ./gradlew lintDebug --build-cache --parallel --no-daemon

      - name: Run unit tests
        env:
          GRADLE_OPTS: >
            -Xmx4g
            -Dkotlin.daemon.jvm.options=-Xmx2g
        run: ./gradlew testDebug --build-cache --parallel --no-daemon

      - name: Build APK
        if: github.base_ref == 'develop' || github.ref_name == 'develop' || github.event_name == 'workflow_dispatch'
        env:
          GRADLE_OPTS: >
            -Xmx4g
            -Dkotlin.daemon.jvm.options=-Xmx2g
        run: ./gradlew assemble${{ github.event.inputs.build_type || 'Debug' }} --build-cache --parallel --no-daemon

      # --- UPLOAD & COMMENT ---

      - name: Upload APK Artifact
        if: github.base_ref == 'develop' || github.ref_name == 'develop' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type || 'Debug' }}-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Comment PR with download link
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Build successful!**\n\nThe APK has been built successfully for the \`develop\` branch. You can download it directly from the [Workflow Run page](${runUrl}).\n\n> *Note: Scroll to the bottom of the page to the **Artifacts** section to download the \`app-Debug-apk.zip\` file.*`
            });